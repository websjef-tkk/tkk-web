# Synker aktiviteter fra iSonen til Sanity hver hele time.
# Vercel Hobby tillater bare daglige cron-jobber, så timekjøringen går via GitHub Actions.
# Krever repo-secrets CRON_SECRET (samme verdi som i Vercel) og SITE_URL (f.eks. https://www.tkk.no).
name: Synk iSonen

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kall /api/sync-isonen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        # Krever eksakt HTTP 200: et redirect (f.eks. til Vercel-innlogging) skal ikke gi grønn kjøring.
        run: |
          url="${SITE_URL%/}/api/sync-isonen"
          echo "Kaller $url"
          status=$(curl -sS -o response.txt -w "%{http_code}" --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "HTTP $status"
          head -c 2000 response.txt; echo
          [ "$status" = "200" ]
